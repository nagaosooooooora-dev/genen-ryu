<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>げんえん竜</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="げんえん竜">
<meta name="theme-color" content="#121620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>

/* =====================================================================
   UI LAYER: STYLES
   ===================================================================== */
:root {
  --bg: #EEF1F4; --surface: #FFFFFF; --ink: #1E2230; --muted: #687084; --line: #D8DDE6;
  --save: #1F8A5B; --waste: #B0435E;
  --win: #121620; --win-ink: #F4F4F0; --gold: #F0C850; --dark: #9A6AD8;
  --font: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --dot: "DotGothic16", "Hiragino Sans", "Noto Sans JP", monospace;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12151C; --surface: #1C212B; --ink: #E8EAF0; --muted: #98A0B2; --line: #2C3340; --save: #4CC08A; --waste: #E57A95; }
}
:root[data-theme="dark"] { --bg: #12151C; --surface: #1C212B; --ink: #E8EAF0; --muted: #98A0B2; --line: #2C3340; --save: #4CC08A; --waste: #E57A95; }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; padding: 14px 16px 120px; }
.app-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.app-title { font-family: var(--dot); font-size: 1.1rem; font-weight: 400; margin: 0; letter-spacing: .02em; white-space: nowrap; }
.status { font-size: .6875rem; color: var(--muted); margin: 0 0 0 auto; white-space: nowrap; }

/* RPG風の窓とボタン */
.rpg-window { background: var(--win); color: var(--win-ink); border: 3px solid var(--win-ink); border-radius: 6px; box-shadow: 0 0 0 3px var(--win); }
.rpg-btn { font-family: var(--dot); background: var(--win); color: var(--win-ink); border: 3px solid var(--win-ink); border-radius: 6px; box-shadow: 0 0 0 3px var(--win); padding: 10px 18px; cursor: pointer; letter-spacing: .05em; }
.rpg-btn:hover, .rpg-btn:focus-visible { outline: none; }
.rpg-btn:hover::before, .rpg-btn:focus-visible::before { content: "▶ "; color: var(--gold); }
.rpg-btn.small { padding: 6px 12px; font-size: .875rem; }

/* ゲーム画面 */
.scene { position: relative; width: 100%; aspect-ratio: 128 / 78; border-radius: 10px; overflow: hidden; background: #000; margin: 6px 0 14px; box-shadow: 0 0 0 3px var(--win), 0 0 0 6px var(--win-ink), 0 0 0 9px var(--win); }
.scene canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.scene-name { position: absolute; left: 8px; top: 8px; font-family: var(--dot); font-size: .8125rem; color: var(--win-ink); background: rgba(18,22,32,.8); border: 2px solid var(--win-ink); border-radius: 4px; padding: 1px 8px; }
.preview-badge { position: absolute; right: 8px; top: 8px; font-size: .75rem; color: #fff; background: rgba(176,67,94,.9); border-radius: 999px; padding: 2px 10px; }
.rpg-msg { position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 5px 10px 3px; font-family: var(--dot); font-size: .8125rem; line-height: 1.45; white-space: pre-line; cursor: pointer; animation: msgIn .25s ease both; }
.rpg-msg .next { display: block; text-align: right; font-size: .625rem; line-height: 1; animation: blink 1s steps(1) infinite; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } }
@keyframes blink { 50% { opacity: 0; } }
.rpg-ask { position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 6px 10px; font-family: var(--dot); font-size: .8125rem; line-height: 1.45; }
.rpg-ask > span { display: block; white-space: pre-line; }
.rpg-ask .choices { display: flex; gap: 8px; margin-top: 4px; justify-content: flex-end; }
.rpg-ask .rpg-btn.small { padding: 2px 12px; font-size: .8125rem; box-shadow: none; border-width: 2px; }

/* 経験値バー */
.exp { padding: 10px 12px 12px; margin: 0 3px 14px; }
.exp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--dot); font-size: .875rem; }
.exp-name { font-size: 1rem; }
.exp-bar { height: 12px; margin-top: 6px; background: #2A3040; border: 2px solid var(--win-ink); border-radius: 3px; overflow: hidden; }
.exp-bar span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .6s ease; }
.exp.dark .exp-bar span { background: var(--dark); }

.pace { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 4px 2px 0; }
.pace-label { font-size: .8125rem; color: var(--muted); }
.pace .period { margin: 0; }
.pace .period button[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.pace-hint { font-size: .75rem; color: var(--muted); width: 100%; }
.total { margin: 0 2px 4px; display: flex; align-items: baseline; gap: 10px; }
.total-label { font-size: .875rem; color: var(--muted); }
.total-num { font-size: 2.2rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.pos { color: var(--save); } .neg { color: var(--waste); }

.period { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin: 10px 0 12px; }
.period button { border: 0; background: none; padding: 5px 16px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.period button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.split div { background: var(--surface); border-radius: 12px; padding: 10px 14px; }
.split dt { font-size: .8125rem; color: var(--muted); }
.split dd { margin: 0; font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.split .save dd { color: var(--save); } .split .waste dd { color: var(--waste); }
.split .net-cell { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; }

h2.section { font-size: .9375rem; margin: 24px 0 8px; }
.cats { background: var(--surface); border-radius: 14px; padding: 4px 14px; }
.cat { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: .9375rem; }
.cat:last-child { border-bottom: 0; }
.cat .s { color: var(--save); } .cat .w { color: var(--waste); } .cat .zero { color: var(--line); }
.day { margin-bottom: 14px; }
.day-head { display: flex; justify-content: space-between; font-size: .8125rem; color: var(--muted); padding: 0 4px 4px; font-variant-numeric: tabular-nums; }
.entries { background: var(--surface); border-radius: 14px; overflow: hidden; }
.entry { display: grid; grid-template-columns: 6px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: none; padding: 12px 14px 12px 0; cursor: pointer; border-bottom: 1px solid var(--line); }
.entries .entry:last-child { border-bottom: 0; }
.entry .mark { align-self: stretch; border-radius: 0 4px 4px 0; }
.entry.save .mark { background: var(--save); } .entry.waste .mark { background: var(--waste); }
.entry .memo { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .meta { display: block; font-size: .75rem; color: var(--muted); }
.entry .amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.entry.save .amt { color: var(--save); } .entry.waste .amt { color: var(--waste); }
.empty { background: var(--surface); border-radius: 14px; padding: 22px 16px; color: var(--muted); text-align: center; }
.church { margin-top: 36px; text-align: center; }
.church .hint { font-size: .8125rem; color: var(--muted); margin: 10px 0 0; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; justify-content: center; }
.dock .rpg-btn { width: 100%; max-width: 480px; font-size: 1.05rem; }

/* 記録の窓 */
dialog.sheet { padding: 0; margin: auto auto 0; width: calc(100% - 12px); max-width: 500px; max-height: 92vh; border-bottom: 0; border-radius: 10px 10px 0 0; margin-bottom: 0; }
dialog.sheet::backdrop { background: rgba(8, 10, 16, .55); }
.sheet form { padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; max-height: 92vh; }
.sheet h2 { margin: 0 0 14px; font-family: var(--dot); font-weight: 400; font-size: 1.1rem; }
.type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.type-toggle input, .chips input { position: absolute; opacity: 0; pointer-events: none; }
.type-toggle span { display: block; text-align: center; padding: 10px; border-radius: 6px; border: 2px solid #4A5266; font-family: var(--dot); cursor: pointer; }
.type-toggle input[value="save"]:checked + span { border-color: var(--gold); color: var(--gold); }
.type-toggle input[value="waste"]:checked + span { border-color: var(--dark); color: var(--dark); }
.type-toggle input:focus-visible + span, .chips input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.field { display: block; border: 0; margin: 0 0 12px; padding: 0; min-width: 0; }
.field > span, .field legend { display: block; font-size: .8125rem; color: #B8BECC; margin-bottom: 4px; padding: 0; }
.field input[type="text"], .field input[type="date"] { width: 100%; padding: 10px 12px; border: 2px solid #4A5266; border-radius: 6px; background: #1C2230; color: var(--win-ink); color-scheme: dark; }
.amount-wrap { display: flex; align-items: center; gap: 6px; border: 2px solid #4A5266; border-radius: 6px; padding: 0 12px; background: #1C2230; }
.amount-wrap input { border: 0; background: none; width: 100%; padding: 8px 0; font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; outline: none; color: var(--win-ink); }
.amount-wrap:focus-within { outline: 3px solid var(--gold); outline-offset: 2px; }
.hint { display: block; font-size: .75rem; color: #98A0B2; margin-top: 4px; }
.err { display: block; font-size: .8125rem; color: #FF9AAE; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { display: inline-block; padding: 5px 12px; border-radius: 999px; border: 2px solid #4A5266; font-size: .875rem; cursor: pointer; }
.chips input:checked + span { border-color: var(--win-ink); background: var(--win-ink); color: var(--win); }
.sheet-actions { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 10px; }
.text-danger { border: 0; background: none; color: #FF9AAE; cursor: pointer; margin-right: auto; padding: 8px 4px; }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(8px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: .875rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--waste); color: #fff; }

/* テストパネル */
.dev-toggle { white-space: nowrap; border: 1px dashed var(--muted); background: none; border-radius: 999px; padding: 2px 10px; font-size: .75rem; color: var(--muted); cursor: pointer; }
.dev { margin: 0 0 14px; padding: 10px; border: 1px dashed var(--muted); border-radius: 12px; font-size: .8125rem; }
.dev p { margin: 0 0 8px; color: var(--muted); }
.dev-stages { display: flex; flex-wrap: wrap; gap: 5px; }
.dev button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: .8125rem; }
.dev button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dev-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
.dev-row input { width: 8.5em; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.backup { margin-top: 30px; }
.backup .hint { font-size: .8125rem; color: var(--muted); margin: 0 0 10px; }
.backup-row { display: flex; gap: 12px; }
.file-btn { position: relative; overflow: hidden; display: inline-block; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
/* ホーム画面から全画面で開いたとき、上の時計やバッテリー表示に重ならないように */
@media (display-mode: standalone) { .app { padding-top: 6px; } }


/* ===== げんえん竜で足した部分 ===== */
/* 浮いたお金・最後の1本から */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.stat { background: var(--surface); border-radius: 12px; padding: 10px 14px 12px; min-width: 0; }
.stat dt { font-size: .8125rem; color: var(--muted); }
.stat dd { margin: 0; font-size: 1.45rem; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat dd small { font-size: .9rem; font-weight: 700; }
.exp-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exp-next { white-space: nowrap; font-size: .8125rem; }
.undo-row { text-align: right; margin: 6px 2px 0; min-height: 1.6em; }
.text-btn { border: 0; background: none; color: var(--muted); font-size: .8125rem; cursor: pointer; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
.plan { background: var(--surface); border-radius: 14px; padding: 4px 14px; }
.plan-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .9375rem; font-variant-numeric: tabular-nums; }
.plan-row:last-of-type { border-bottom: 0; }
.plan-row span:first-child { color: var(--muted); }
.plan-edit { display: block; margin: 10px 0 0 auto; }
.dock .rpg-btn { font-size: 1.15rem; padding: 12px 18px; }

/* 設定の窓 */
.sheet h2 { margin-bottom: 6px; }
.sheet .lead { font-size: .8125rem; color: #B8BECC; margin: 0 0 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.num { display: flex; align-items: center; gap: 6px; border: 2px solid #4A5266; border-radius: 6px; padding: 0 12px; background: #1C2230; }
.num input { border: 0; background: none; width: 100%; min-width: 0; padding: 8px 0; font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; outline: none; color: var(--win-ink); }
.num:focus-within { outline: 3px solid var(--gold); outline-offset: 2px; }
.num span { color: #B8BECC; font-size: .875rem; }
.forecast { font-size: .8125rem; color: var(--win-ink); background: #1C2230; border-radius: 6px; padding: 8px 10px; margin: 2px 0 6px; line-height: 1.55; }

/* 取り消しボタンつきのお知らせ */
.toast { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.toast.show { pointer-events: auto; }
.toast.has-action { padding: 6px 6px 6px 16px; }
.toast button { border: 0; background: none; color: var(--gold); font-weight: 700; padding: 4px 8px; cursor: pointer; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast button { color: #8A5A00; } }
:root[data-theme="dark"] .toast button { color: #8A5A00; }
</style>
</head>

<script>
const DEV_TOOLS = false;
const STORE_KEY = "genen-ryu:v2";
/* =====================================================================
   1. DOMAIN（計算と入力チェック。画面・保存先に依存しない）
   ===================================================================== */
const Domain = (() => {
  const MIN = 6e4, HOUR = 36e5, DAY = 864e5;
  const MAX_EXP = 1000;   // 伝説の勇者になる経験値

  /** 全角数字・カンマ・単位を許容して整数に */
  function toInt(raw) {
    const s = String(raw ?? '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[,，¥￥\s円本]/g, '');
    return /^\d+$/.test(s) ? Number(s) : NaN;
  }

  function normalizeSettings(input) {
    return { usual: toInt(input.usual), target: toInt(input.target), packPrice: toInt(input.packPrice), packCount: toInt(input.packCount) };
  }

  function validateSettings(input) {
    const s = normalizeSettings(input), errors = {};
    if (!Number.isInteger(s.usual) || s.usual < 1) errors.usual = '1本以上で入れてください';
    else if (s.usual > 100) errors.usual = '100本までです';
    if (!Number.isInteger(s.target)) errors.target = '0本以上で入れてください';
    else if (!errors.usual && s.target >= s.usual) errors.target = 'いつもの本数より少なくしてください';
    if (!Number.isInteger(s.packPrice) || s.packPrice < 1) errors.packPrice = '1円以上で入れてください';
    else if (s.packPrice > 10000) errors.packPrice = '1万円までです';
    if (!Number.isInteger(s.packCount) || s.packCount < 1) errors.packCount = '1本以上で入れてください';
    else if (s.packCount > 100) errors.packCount = '100本までです';
    return errors;
  }

  /**
   * 増減の式
   * いつもの本数Uを吸うと増減ゼロ。「減らし幅の7割」のペース（1日 U − 0.7×(U−T) 本）で、ちょうど90日で経験値1,000に届く。
   * 1本の減少量 p = 1000 ÷ (63×(U−T))、1日の増加量 G = p×U
   */
  function rates(s) {
    const p = MAX_EXP / (63 * (s.usual - s.target));
    return { p, perDay: p * s.usual, perMs: p * s.usual / DAY };
  }

  /** その時点の経験値。吸わずにいる時間でじわじわ増え、1本ごとに減る。マイナスにもなる（魔王の道） */
  function expAt(data, now) {
    if (!data.settings || data.startAt == null) return 0;
    const { p, perMs } = rates(data.settings);
    const smoked = data.smokes.filter(t => t <= now).length;
    return perMs * Math.max(0, now - data.startAt) - p * smoked;
  }

  /** 浮いたお金 ＝ 減らせた本数 × 1本の値段（いつもより多く吸うとマイナス） */
  function savedMoney(data, now) {
    if (!data.settings || data.startAt == null) return 0;
    const s = data.settings, days = Math.max(0, now - data.startAt) / DAY;
    const smoked = data.smokes.filter(t => t <= now).length;
    return Math.trunc((s.usual * days - smoked) * s.packPrice / s.packCount);
  }

  const lastSmoke = data => data.smokes.length ? data.smokes[data.smokes.length - 1] : null;

  /** 経過時間を「3時間12分」の形に */
  function duration(ms) {
    const m = Math.floor(Math.max(0, ms) / MIN);
    if (m < 60) return [[m, '分']];
    const h = Math.floor(m / 60);
    if (h < 24) return [[h, '時間'], [m % 60, '分']];
    return [[Math.floor(h / 24), '日'], [h % 24, '時間']];
  }
  /** 目安の時間を「約3時間」の形に */
  function roughly(ms) {
    const m = Math.ceil(Math.max(0, ms) / MIN);
    if (m < 60) return `約${Math.max(1, m)}分`;
    const h = Math.round(m / 60);
    if (h < 24) return `約${h}時間`;
    const d = Math.floor(h / 24), rh = h % 24;
    return rh ? `約${d}日${rh}時間` : `約${d}日`;
  }

  /** 目標の本数を続けたときに、伝説の勇者まで何日か */
  const daysToMax = s => Math.ceil(MAX_EXP / (rates(s).p * (s.usual - s.target)));

  return Object.freeze({ MIN, HOUR, DAY, MAX_EXP, toInt, normalizeSettings, validateSettings, rates, expAt, savedMoney, lastSmoke, duration, roughly, daysToMax });
})();

/* =====================================================================
   2. REPOSITORY（保存先。この端末の中だけ）
   ===================================================================== */
const Repo = (() => {
  const empty = () => ({ settings: null, startAt: null, smokes: [] });
  function clean(d) {
    if (!d || typeof d !== 'object') return null;
    const out = empty();
    if (d.settings && Object.keys(Domain.validateSettings(d.settings)).length === 0) out.settings = Domain.normalizeSettings(d.settings);
    if (Number.isFinite(d.startAt)) out.startAt = d.startAt;
    if (Array.isArray(d.smokes)) out.smokes = d.smokes.filter(Number.isFinite).sort((a, b) => a - b);
    if (out.settings && out.startAt == null) return null;
    return out;
  }
  function create(key) {
    return {
      load() { try { return clean(JSON.parse(localStorage.getItem(key))) || empty(); } catch { return empty(); } },
      save(data) { try { localStorage.setItem(key, JSON.stringify(data)); return true; } catch { return false; } },
      getMeta(name) { try { return localStorage.getItem(`${key}:${name}`); } catch { return null; } },
      setMeta(name, v) { try { localStorage.setItem(`${key}:${name}`, v); } catch {} },
    };
  }
  return Object.freeze({ create, clean, empty });
})();

/* =====================================================================
   3. CORE（状態とアクション。UIはこれだけを使う）
   ---------------------------------------------------------------------
   core.getState()        -> { settings, startAt, smokes }
   core.subscribe(fn)     -> unsubscribe
   core.saveSettings(in)  -> { ok, errors? }   はじめての設定もここ
   core.smoke()           -> { ok }            1本記録
   core.undoLast()        -> { ok }            最後の1本を取り消す
   core.resetAll()        -> { ok }            教会：記録を全部消して、村人から
   core.importData(obj)   -> { ok, count?, error? }
   core.view(now)         -> { exp, money, last, since }
   ===================================================================== */
function createCore(repo) {
  let state = repo.load();
  const listeners = new Set();
  const commit = next => {
    state = next;
    const ok = repo.save(state);
    listeners.forEach(fn => fn(state));
    return ok ? { ok: true } : { ok: false, error: '保存できませんでした。端末の空き容量を確認してください。' };
  };
  return Object.freeze({
    getState: () => state,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    saveSettings(input) {
      const errors = Domain.validateSettings(input);
      if (Object.keys(errors).length) return { ok: false, errors };
      return commit({ ...state, settings: Domain.normalizeSettings(input), startAt: state.startAt ?? Date.now() });
    },
    smoke(now = Date.now()) {
      if (!state.settings) return { ok: false, error: '先に本数を設定してください。' };
      return commit({ ...state, smokes: [...state.smokes, now].sort((a, b) => a - b) });
    },
    undoLast() {
      if (!state.smokes.length) return { ok: false, error: '取り消す記録がありません。' };
      return commit({ ...state, smokes: state.smokes.slice(0, -1) });
    },
    resetAll() { return commit({ ...state, startAt: Date.now(), smokes: [] }); },
    importData(obj) {
      const d = Repo.clean(obj && obj.data);
      if (!d || !d.settings) return { ok: false, error: 'このファイルは読み込めませんでした' };
      const r = commit(d);
      return r.ok ? { ok: true, count: d.smokes.length } : r;
    },
    /** テスト用：記録をすべて過去へずらして、時間がたったことにする */
    devShift(ms) { if (!state.settings) return; commit({ ...state, startAt: state.startAt - ms, smokes: state.smokes.map(t => t - ms) }); },
    view(now = Date.now()) {
      const last = Domain.lastSmoke(state);
      return {
        exp: Domain.expAt(state, now),
        money: Domain.savedMoney(state, now),
        last,
        since: state.startAt == null ? 0 : now - (last ?? state.startAt),
      };
    },
  });
}

JOURNEY.forEach((s, i) => { s.rank = i; });

// 各段階になる経験値。勇者の道は「この値以上」、魔王の道は「この値以上のマイナス」でその姿になる
// （前作の金額の1/100。目標の7割のペースで、伝説の勇者まで約90日）
const THRESHOLDS = {
  squire: 5, warrior: 20, knight: 50, paladin: 150, hero: 400,   hero2: 700,      legend: 1000,
  imp: 5,    thief: 20,   bandit: 50, pirate: 150,  pirate2: 250, darkknight: 400, demonlord: 1000,
};
for (const s of JOURNEY) {
  if (s.side === 1) s.min = THRESHOLDS[s.id];
  if (s.side === -1) s.max = -THRESHOLDS[s.id];
}
const VILLAGER_RANK = JOURNEY.findIndex(s => s.id === 'villager');

const Journey = Object.freeze({
  stageFor(net) {
    const up = JOURNEY[VILLAGER_RANK + 1].min, down = JOURNEY[VILLAGER_RANK - 1].max;
    if (net >= up) return [...JOURNEY].reverse().find(s => s.side === 1 && net >= s.min);
    if (net <= down) return JOURNEY.find(s => s.side === -1 && net <= s.max);
    return JOURNEY[VILLAGER_RANK];
  },
  /** 経験値バーの進み具合。dark=魔王の道に向かっているか（前作と同じ） */
  progress(net) {
    const dark = net < 0, a = Math.abs(net);
    const ladder = dark
      ? [{ t: 0, s: JOURNEY[VILLAGER_RANK] }, ...JOURNEY.filter(s => s.side === -1).reverse().map(s => ({ t: -s.max, s }))]
      : [{ t: 0, s: JOURNEY[VILLAGER_RANK] }, ...JOURNEY.filter(s => s.side === 1).map(s => ({ t: s.min, s }))];
    let i = 0; ladder.forEach((l, k) => { if (a >= l.t) i = k; });
    const cur = ladder[i], next = ladder[i + 1];
    if (!next) return { dark, ratio: 1 };
    return { dark, ratio: (a - cur.t) / (next.t - cur.t) };
  },
  /** ひとつ光の側の姿になるのに必要な経験値。null=もう最後の姿 */
  nextUp(net) {
    const s = Journey.stageFor(net);
    if (s.side === -1) return s.max + 0.01;
    const n = JOURNEY[s.rank + 1];
    return n ? n.min : null;
  },
  /** 姿が変わったときの一言と、画面の光り方（light=白く光る、dim=少し暗くなる、dark=暗転） */
  message(from, to) {
    if (to.rank > from.rank) {   // 光の方へ
      if (to.side === 1) return { fx: 'light', text: to.enter };
      if (to.side === 0) return { fx: 'light', text: to.backFromDark };
      return { fx: 'light', text: to.back };
    }
    if (to.side === -1) return { fx: to.id === 'darkknight' || to.id === 'demonlord' ? 'dark' : 'dim', text: to.enter };
    if (to.side === 0) return { fx: 'dim', text: to.backFromLight };
    return { fx: 'dim', text: to.back };
  },
  sample(id) {   // テスト用：その姿のまん中あたりの経験値
    const s = JOURNEY.find(x => x.id === id);
    if (s.side === 0) return 0;
    if (s.side === 1) { const n = JOURNEY[s.rank + 1]; return n ? (s.min + n.min) / 2 : s.min + 50; }
    const n = JOURNEY[s.rank - 1]; return n ? (s.max + n.max) / 2 : s.max - 50;
  },
});

/* ---- 4b. ゲーム画面：背景を帯ごとに流し、主人公の絵を切り替えて揺らす ---- */
const Scene = (() => {
  const W = 768, H = 468;
  // top=切り出す上端、feet=足元の高さ、bands=[上端,下端,速さの割合]、water=水面、scroll=流す下側の開始位置
  const BGS = {
    village:  { top: 0,  feet: 372, bands: [[0, 200, .08], [200, 350, .35], [350, 512, 1]] },
    meadow:   { top: 34, feet: 374, bands: [[0, 270, .08], [270, 385, .35], [385, 512, 1]] },
    forest:   { top: 28, feet: 374, bands: [[0, 120, .08], [120, 372, .35], [372, 512, 1]] },
    road:     { top: 1,  feet: 374, bands: [[0, 210, .08], [210, 345, .35], [345, 512, 1]] },
    mountain: { top: 44, feet: 376, bands: [[0, 300, .08], [300, 395, .35], [395, 512, 1]] },
    dusk:     { top: 38, feet: 374, bands: [[0, 300, .08], [300, 382, .35], [382, 512, 1]] },
    waste:    { top: 0,  feet: 366, bands: [[0, 200, .08], [200, 347, .35], [347, 512, 1]] },
    night:    { top: 21, feet: 374, bands: [[0, 190, .08], [190, 350, .35], [350, 512, 1]] },
    sea:      { top: 44, water: 396, scroll: 330 },
    storm:    { top: 44, water: 396, scroll: 340 },
    sky:      { top: 44, scroll: 372 },
    crimson:  { top: 44, scroll: 392 },
    castle:   { top: 44, scroll: 380 },
  };
  const GROUND_SPEED = { stand: 0.07, ride: 0.16 };
  const PERIOD = { stand: 650, ride: 420, ship: 900, fly: 480 };

  function mount(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const load = src => { const i = new Image(); i.src = src; return i; };
    const BGI = {}, SPI = {};
    for (const k in ASSETS.bg) BGI[k] = load(ASSETS.bg[k]);
    for (const k in ASSETS.spr) SPI[k] = ASSETS.spr[k].frames.map(load);
    let stage = JOURNEY[VILLAGER_RANK], fx = null;
    const t0 = performance.now();

    function strip(im, sy, sh, dy, off) {   // 1枚おきに左右反転して並べ、継ぎ目なく流す
      const iw = im.width, o = ((off % (iw * 2)) + iw * 2) % (iw * 2);
      for (let k = -1; k < 3; k++) {
        const x = k * iw - o;
        if (x > W || x + iw < 0) continue;
        if (((k % 2) + 2) % 2 === 1) { ctx.save(); ctx.translate(x + iw, dy); ctx.scale(-1, 1); ctx.drawImage(im, 0, sy, iw, sh, 0, 0, iw, sh); ctx.restore(); }
        else ctx.drawImage(im, 0, sy, iw, sh, x, dy, iw, sh);
      }
    }
    function drawBG(s, t, from) {
      const cfg = BGS[s.bg], im = BGI[s.bg];
      if (!im.complete || !im.width) return;
      const speed = s.type === 'fly' ? 0.06 : s.type === 'ship' ? (s.fast ? 0.05 : 0.03) : 0;
      if (from !== undefined) { const sy = from + cfg.top; strip(im, sy, im.height - sy, from, t * speed); return; }
      if (cfg.scroll !== undefined) {
        ctx.drawImage(im, 0, cfg.top, W, cfg.scroll - cfg.top, 0, 0, W, cfg.scroll - cfg.top);
        strip(im, cfg.scroll, im.height - cfg.scroll, cfg.scroll - cfg.top, t * speed);
      } else {
        const gs = GROUND_SPEED[s.type] || 0;
        for (const [a, b, k] of cfg.bands) strip(im, a, b - a, a - cfg.top, t * gs * k);
      }
    }
    function frame(now) {
      const t = Math.max(0, now - t0), s = stage, cfg = BGS[s.bg];
      drawBG(s, t);
      const frames = SPI[s.id], meta = ASSETS.spr[s.id];
      const fi = Math.floor(t / PERIOD[s.type]) % frames.length, im = frames[fi];
      if (im && im.complete && im.width) {
        const w = meta.w, h = meta.h, x = Math.round(W / 2 - w / 2);
        let y;
        if (s.type === 'stand' || s.type === 'ride') {
          const bob = meta.up >= 0 ? (fi === meta.up ? -6 : 0) : (Math.floor(t / PERIOD[s.type]) % 2 ? -6 : 0);
          y = cfg.feet - h + bob;
          ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(W / 2, cfg.feet - 2, w * 0.36, 7, 0, 0, Math.PI * 2); ctx.fill();
        } else if (s.type === 'ship') {
          y = cfg.water + 16 - h + Math.round(Math.sin(t / 1600 * 2 * Math.PI) * (s.rough ? 12 : 6) / 6) * 6;
        } else {
          y = Math.round((Math.max(200, 30 + h / 2) - h / 2 + Math.sin(t / 2400 * 2 * Math.PI) * 12) / 6) * 6;
        }
        ctx.drawImage(im, x, y, w, h);
        if (s.type === 'ship') drawBG(s, t, cfg.water);   // 船底を手前の水で隠す
      }
      if (s.rain) { ctx.fillStyle = 'rgba(210,220,240,.55)'; for (let i = 0; i < 60; i++) ctx.fillRect(Math.round((i * 131 + t * 0.35) % W), Math.round((i * 71 + t * 0.9) % H), 3, 14); }
      if (s.flash && (t % 4800) < 90) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(0, 0, W, H); }
      if (fx) {   // 姿が変わるときの光り方
        const e = (now - fx.start) / fx.dur;
        if (e >= 1) fx = null;
        else {
          const a = 1 - e;
          ctx.fillStyle = fx.kind === 'light' ? `rgba(255,255,240,${a})` : fx.kind === 'dark' ? `rgba(20,6,30,${a})` : `rgba(40,30,60,${a * 0.55})`;
          ctx.fillRect(0, 0, W, H);
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    return {
      setStage(s) { stage = s; },
      flash(kind, dur = 900) { fx = { kind, start: performance.now(), dur }; },
    };
  }
  return Object.freeze({ mount });
})();

/* ---- 4c. 画面 ---- */

          <div class="backup-row">

            <label class="field"><span>いつも1日に吸う本数</span><div class="num"><input name="usual" inputmode="numeric" autocomplete="off"><span>本</span></div><small class="err" data-err="usual"></small></label>

          <div class="sheet-actions">

      <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-btn" hidden></button></div>`;

    const $ = sel => root.querySelector(sel);
    const sheet = $('#sheet'), form = $('#set-form');
    const scene = Scene.mount($('#stage'));

    function toast(msg, { error = false, action = null, label = '' } = {}) {
      const t = $('#toast'), b = $('#toast-btn');
      $('#toast-text').textContent = msg; t.classList.toggle('error', error); t.classList.toggle('has-action', !!action);
      toastAction = action; b.hidden = !action; b.textContent = label; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.classList.remove('show'); toastAction = null; }, action ? 6000 : error ? 4000 : 1800);

    $('#toast-btn').addEventListener('click', () => { const a = toastAction; $('#toast').classList.remove('show'); toastAction = null; if (a) a(); });

      $('#dock').hidden = !s;

    function render() { renderStats(); return renderJourney(); }

    /* 姿が変わったら、光る／暗転して一言 */
    function onStage(stage) {
      if (praying) { scene.flash('light', 1400); say(PRAY_DONE); praying = false; }
      else if (lastStage && stage.id !== lastStage.id) { const m = Journey.message(lastStage, stage); scene.flash(m.fx); say(m.text); }

      if (previewNet == null) repoMeta.set('seen', stage.id);
    }

    /* 設定の窓 */
    const readForm = () => Object.fromEntries(FIELDS.map(k => [k, form.elements[k].value]));
    function showErrors(errors = {}) { form.querySelectorAll('[data-err]').forEach(el => { el.textContent = errors[el.dataset.err] || ''; }); }
    function forecast() {

      const s = Domain.normalizeSettings(raw), mid = Math.round(s.usual - 0.7 * (s.usual - s.target));
      f.hidden = false;
      f.textContent = `1日${s.target}本なら約${Math.round(Domain.daysToMax(s) / 30 * 10) / 10}か月、${mid}本なら約3か月で伝説の勇者に。${s.usual}本より多く吸うと、魔王の道へ進みます。`;
    }
    function openSheet() {
      const s = core.getState().settings, first = !s;
      showErrors();
      form.elements.usual.value = s ? s.usual : '';
      form.elements.target.value = s ? s.target : '';
      form.elements.packPrice.value = s ? s.packPrice : '';
      form.elements.packCount.value = s ? s.packCount : '20';
      $('#sheet-title').textContent = first ? 'はじめに' : '設定を変える';
      $('#sheet-lead').textContent = first ? 'いつもの本数と目標を教えてください。吸わずにいる時間で勇者に近づき、1本吸うと少し戻ります。' : '本数を変えると、これまでの記録も新しい本数で計算し直します。';
      $('#save-btn').textContent = first ? 'はじめる' : '変える';
      $('#cancel-btn').hidden = first;
      forecast(); sheet.showModal();
      if (first) form.elements.usual.focus();
    }
    form.addEventListener('input', forecast);
    form.addEventListener('submit', e => {
      e.preventDefault();
      const first = !core.getState().settings;
      const res = core.saveSettings(readForm());
      if (res.errors) { showErrors(res.errors); return; }
      if (!res.ok) { toast(res.error, { error: true }); return; }
      sheet.close();
      if (first) say('あたらしい たびが はじまった！\nけむりに まけるな');
      else toast('設定を変えました');
    });
    $('#cancel-btn').addEventListener('click', () => sheet.close());
    sheet.addEventListener('cancel', e => { if (!core.getState().settings) e.preventDefault(); });
    sheet.addEventListener('click', e => { if (e.target === sheet && core.getState().settings) sheet.close(); });
    $('#edit').addEventListener('click', openSheet);

    /* 吸った・取り消し */
    const undo = () => { const r = core.undoLast(); toast(r.ok ? '取り消しました' : r.error, { error: !r.ok }); };
    $('#smoke').addEventListener('click', () => {
      const res = core.smoke();
      if (!res.ok) { toast(res.error, { error: true }); return; }
      toast('1本 記録しました', { action: undo, label: '取り消す' });
    });
    $('#undo').addEventListener('click', e => {   // まちがえて押さないよう、2回押しで取り消す
      const b = e.currentTarget;
      if (!undoArmed) {
        const ago = Domain.duration(core.view().since).map(([n, u]) => n + u).join('');
        b.textContent = `${ago}前の1本を取り消す（もう一度押す）`;
        undoArmed = setTimeout(() => { undoArmed = null; b.textContent = '最後の1本を取り消す'; }, 4000);
        return;
      }
      clearTimeout(undoArmed); undoArmed = null; b.textContent = '最後の1本を取り消す';
      undo();
    });

    /* 教会：おいのりで全部消して村人に戻る */
    $('#church').addEventListener('click', () => { $('#msg').hidden = true; $('#ask').hidden = false; $('#scene').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('#pray-no').focus(); });
    $('#pray-no').addEventListener('click', () => { $('#ask').hidden = true; say('しんぷ「また いつでも おいでなさい」'); });
    $('#pray-yes').addEventListener('click', () => {
      $('#ask').hidden = true; praying = true; previewNet = null;
      const res = core.resetAll();
      if (!res.ok) { praying = false; toast(res.error, { error: true }); }
    });

    /* バックアップ */
    $('#export').addEventListener('click', () => {
      const data = { app: 'genen-ryu', version: 2, exportedAt: new Date().toISOString(), data: core.getState() };
      const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
      const d = new Date(), pad = n => String(n).padStart(2, '0');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `genen-ryu-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('記録を書き出しました');
    });
    $('#import').addEventListener('change', async e => {
      const file = e.target.files[0]; e.target.value = '';
      if (!file) return;
      try {
        const res = core.importData(JSON.parse(await file.text()));
        toast(res.ok ? `${res.count}本分の記録を読み込みました` : res.error, { error: !res.ok });
      } catch { toast('このファイルは読み込めませんでした', { error: true }); }
    });

    /* テストパネル */
    if (DEV_TOOLS) DevTools.mount($('#dev'), $('#dev-toggle'), core, net => { previewNet = net; onStage(renderJourney()); });

    core.subscribe(() => onStage(render()));
    setInterval(() => onStage(render()), 5000);   // 時間で育つので、定期的に描き直す
    document.addEventListener('visibilitychange', () => { if (!document.hidden) onStage(render()); });

    // 前に開いたときから姿が変わっていたら、その一言を出す
    const now = render(), seen = JOURNEY.find(s => s.id === repoMeta.get('seen'));
    lastStage = seen || now;
    onStage(now);
    if (!core.getState().settings) openSheet();
  }
  return Object.freeze({ mount });
})();

/* ---- 4d. テストパネル：記録に触れずに、全部の姿と演出を確認する ---- */
const DevTools = (() => {
  function mount(panel, toggle, core, setPreview) {
    let tour = null;
    panel.innerHTML = `
      <p>姿を選ぶと、記録に触れずに表示だけ切り替えます。姿が変わるときの演出も出ます。</p>
      <div class="dev-stages">${[...JOURNEY].reverse().map(s => `<button type="button" data-stage="${s.id}">${s.name}</button>`).join('')}</div>
      <div class="dev-row"><button type="button" id="dev-tour">順番に全部再生</button><button type="button" id="dev-exit">実データに戻す</button></div>
      <p style="margin-top:10px">時間を進める（記録を過去へずらします。テスト用の保存先なので本番には影響しません）</p>
      <div class="dev-row"><button type="button" data-shift="3600000">＋1時間</button><button type="button" data-shift="86400000">＋1日</button><button type="button" data-shift="604800000">＋7日</button><button type="button" id="dev-smoke5">5本まとめて吸う</button></div>`;
    const mark = id => panel.querySelectorAll('[data-stage]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.stage === id)));
    const stop = () => { if (tour) { clearInterval(tour); tour = null; panel.querySelector('#dev-tour').textContent = '順番に全部再生'; } };
    const show = net => { setPreview(net); mark(net == null ? null : Journey.stageFor(net).id); };
    toggle.addEventListener('click', () => { const open = panel.hidden; panel.hidden = !open; toggle.setAttribute('aria-expanded', String(open)); if (!open) { stop(); show(null); } });
    panel.addEventListener('click', e => {
      const b = e.target.closest('[data-stage]'); if (b) { stop(); show(Journey.sample(b.dataset.stage)); return; }
      const sh = e.target.closest('[data-shift]'); if (sh) { stop(); show(null); core.devShift(Number(sh.dataset.shift)); }
    });
    panel.querySelector('#dev-smoke5').addEventListener('click', () => { stop(); show(null); for (let i = 0; i < 5; i++) core.smoke(Date.now() - i); });
    panel.querySelector('#dev-exit').addEventListener('click', () => { stop(); show(null); });
    panel.querySelector('#dev-tour').addEventListener('click', e => {
      if (tour) { stop(); return; }
      const ids = [VILLAGER_RANK, ...JOURNEY.slice(VILLAGER_RANK + 1).map(s => s.rank), ...JOURNEY.slice(0, VILLAGER_RANK).reverse().map(s => s.rank)];
      let i = 0; const step = () => { show(Journey.sample(JOURNEY[ids[i]].id)); i = (i + 1) % ids.length; };
      step(); tour = setInterval(step, 4000); e.currentTarget.textContent = '再生を止める';
    });
  }
  return Object.freeze({ mount });
})();

/* =====================================================================
   5. BOOT
   ===================================================================== */
const repo = Repo.create(STORE_KEY);
const repoMeta = { get: n => repo.getMeta(n), set: (n, v) => repo.setMeta(n, v) };
const core = createCore(repo);
UI.mount(core, document.getElementById('app'));
if (!DEV_TOOLS && 'serviceWorker' in navigator && location.protocol === 'https:' && location.hostname.endsWith('github.io')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
